<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TLD:TITLE--></title>
<style>
:root {
  --bg: #f6f7f9; --card: #ffffff; --ink: #1b1f24; --muted: #5b6573; --line: #d5dae1;
  --need: #b3261e; --need-bg: #fdecea; --pr: #6b4eb8; --pr-bg: #f0ebfb;
  --run: #0b5cad; --run-bg: #e6f0fb; --ok: #1b6e3c; --ok-bg: #e5f4ea;
  --warn: #8a5a00; --warn-bg: #fff3d6;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --card: #1d2228; --ink: #e8ebef; --muted: #9aa5b3; --line: #343c46;
    --need: #ff8a80; --need-bg: #3b1d1b; --pr: #c3b0ff; --pr-bg: #2b2442;
    --run: #8ec1ff; --run-bg: #17304b; --ok: #7fd49c; --ok-bg: #173424;
    --warn: #ffd27a; --warn-bg: #3d2f10;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b; --card: #1d2228; --ink: #e8ebef; --muted: #9aa5b3; --line: #343c46;
  --need: #ff8a80; --need-bg: #3b1d1b; --pr: #c3b0ff; --pr-bg: #2b2442;
  --run: #8ec1ff; --run-bg: #17304b; --ok: #7fd49c; --ok-bg: #173424;
  --warn: #ffd27a; --warn-bg: #3d2f10;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); }
body { font: 15px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; max-width: 720px; margin: 0 auto; overflow-wrap: anywhere; }
h1 { font-size: 20px; margin: 0 0 4px; }
h2 { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 22px 0 8px; }
.sub { color: var(--muted); font-size: 13px; }
.counts { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.count { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 2px 10px; font-size: 13px; }
.row, details.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin: 0 0 8px; }
.row.need { border-left: 6px solid var(--need); }
.row.pr { border-left: 6px solid var(--pr); }
.row.run { border-left: 6px solid var(--run); }
.row.done { border-left: 6px solid var(--ok); }
.row.hid { border-left: 6px solid var(--line); }
details > summary { cursor: pointer; list-style: none; }
details > summary::-webkit-details-marker { display: none; }
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; }
.name { font-weight: 600; }
.reason { margin-top: 2px; }
.meta { color: var(--muted); font-size: 13px; }
.tag { font-size: 12px; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; color: var(--muted); }
.badge { font-size: 12px; font-weight: 600; border-radius: 4px; padding: 0 6px; }
.badge.silent { color: var(--need); background: var(--need-bg); border: 1px solid var(--need); }
.badge.failed { color: var(--need); background: var(--need-bg); border: 1px solid var(--need); }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.chip { font-size: 12px; border-radius: 6px; padding: 1px 7px; border: 1px solid var(--line); color: var(--muted); }
.chip.running { color: var(--run); background: var(--run-bg); border-color: var(--run); }
.chip.merged, .chip.done { color: var(--ok); background: var(--ok-bg); border-color: var(--ok); }
.chip.failed { color: var(--need); background: var(--need-bg); border-color: var(--need); font-weight: 600; }
.chip .drift { margin-left: 4px; font-weight: 600; color: var(--warn); }
.chip .drift.collision, .chip .drift.unknown { color: var(--need); }
.chip.gate { color: var(--warn); background: var(--warn-bg); border-color: var(--warn); border-style: dashed; }
.detail { margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }
.stage { margin: 0 0 8px; }
.stage-title { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.item { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin-top: 4px; }
.links a { margin-right: 10px; color: var(--run); }
a { color: var(--run); }
.empty, .notice { color: var(--muted); padding: 6px 0; }
.notice.bad { color: var(--need); }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.row.ask { border-left: 6px solid var(--need); cursor: pointer; }
.row.ask.answered, .row.ask.cancelled { border-left-color: var(--line); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin: 0 0 10px; }
.q { margin: 0 0 14px; }
.q-text { white-space: pre-wrap; margin: 0 0 6px; }
.q-id { font-family: ui-monospace, monospace; font-size: 12px; color: var(--muted); }
.opt { display: flex; gap: 8px; align-items: flex-start; padding: 4px 0; }
.opt input { margin-top: 3px; }
textarea, input[type=password] { width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 6px 8px; }
textarea { min-height: 70px; resize: vertical; }
button { font: inherit; border-radius: 6px; padding: 6px 14px; border: 1px solid var(--run); background: var(--run); color: #fff; cursor: pointer; }
button.quiet { background: transparent; color: var(--run); }
button:disabled { opacity: .6; cursor: default; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.answer { font-weight: 600; white-space: pre-wrap; }
.hidden-view { display: none; }
h2.ask-title { font-size: 18px; text-transform: none; letter-spacing: 0; color: var(--ink); margin: 0 0 4px; }
.back { display: inline-block; margin: 0 0 8px; }
.usage-card h3 { font-size: 15px; margin: 0 0 8px; }
.usage-row { display: flex; align-items: center; gap: 8px; margin: 4px 0; }
.usage-row .lbl { width: 64px; flex: none; }
.usage-row .pct { width: 150px; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
.track { flex: 1 1 auto; height: 14px; background: var(--run-bg); border-radius: 7px; overflow: hidden; }
.fill { height: 100%; background: var(--run); }
.fill.over { background: var(--need); }
.chart { position: relative; height: 120px; display: flex; align-items: flex-end; gap: 2px; border-bottom: 1px solid var(--line); margin-top: 8px; }
.col { flex: 1 1 0; min-width: 2px; background: var(--run); }
.col.over { background: var(--need); }
.col.idle { background: var(--line); }
.limit-line { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--muted); height: 0; pointer-events: none; }
.limit-line span { position: absolute; right: 0; bottom: 1px; font-size: 11px; color: var(--muted); background: var(--card); padding: 0 3px; }
label.field { display: block; margin: 0 0 6px; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <div class="top">
    <h1 id="title"></h1>
    <a href="#usage" class="hidden-view" id="usage-link">Usage</a>
    <button type="button" class="quiet hidden-view" id="logout">Log out</button>
  </div>
  <div class="sub" id="updated"></div>
  <div class="counts" id="counts"></div>
</header>
<section id="login" class="card hidden-view" aria-label="Log in">
  <form id="login-form" autocomplete="on">
    <label class="field" for="passphrase">Owner passphrase</label>
    <input type="password" id="passphrase" name="passphrase" autocomplete="current-password" required minlength="16">
    <div class="actions"><button type="submit" id="login-button">Log in</button></div>
    <div class="notice" id="login-status"></div>
  </form>
</section>
<section id="askview" class="hidden-view" aria-label="Ask"></section>
<section id="usageview" class="hidden-view" aria-label="Subscription usage"></section>
<div class="notice hidden-view" id="flash" role="status"></div>
<main id="main"><div class="notice" id="status">Loading…</div></main>
<script>
/*TLD:RULES*/
</script>
<script>
(function () {
  "use strict";
  var FIXTURE = /*TLD:FIXTURE*/null;
  var FIXED_NOW = /*TLD:NOW*/null;
  var SESSION_URL = /*TLD:SESSION_URL*/null;
  var SESSION_ID = /^[A-Za-z0-9][A-Za-z0-9_.:-]{0,99}$/;
  var MIN = 60000;
  var STATE_GLYPH = { pending: "○", running: "▶", merged: "✓", done: "✓", failed: "✕", gate: "◆" };

  function nowMs() { return FIXED_NOW !== null ? FIXED_NOW : Date.now(); }

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text !== undefined && text !== null) node.textContent = text;
    return node;
  }
  function add(parent) {
    for (var i = 1; i < arguments.length; i++) if (arguments[i]) parent.appendChild(arguments[i]);
    return parent;
  }
  function link(url, text) {
    if (typeof url !== "string" || url.indexOf("https://") !== 0) return null;
    var a = el("a", null, text);
    a.href = url;
    a.target = "_blank";
    a.rel = "noopener noreferrer";
    return a;
  }
  function span(text, cls) { return el("span", cls || "meta", text); }

  function ago(iso, now) {
    if (!iso) return "";
    var mins = Math.max(0, Math.floor((now - Date.parse(iso)) / MIN));
    if (mins < 1) return "just now";
    if (mins < 60) return mins + " min ago";
    if (mins < 1440) return Math.floor(mins / 60) + " h ago";
    return Math.floor(mins / 1440) + " d ago";
  }
  function waited(iso, now) {
    var text = ago(iso, now);
    return text ? "waiting " + text.replace(" ago", "") : "";
  }

  // A session link exists only when the server was given TLD_BOARD_SESSION_URL (the runtime's session base).
  function sessionHref(id) {
    if (typeof SESSION_URL !== "string" || typeof id !== "string" || !SESSION_ID.test(id)) return null;
    return SESSION_URL + encodeURIComponent(id);
  }
  function sessionLink(rec) {
    var href = sessionHref(rec.orchestrator_session);
    return href ? link(href, "session") : null;
  }
  function itemWord(rec) { return rec.kind === "command" ? "Items" : "Phases"; }
  // The last 8 letters or digits of a session id (lower case); "" when fewer than 6 are left.
  function sessionTail(s) {
    if (typeof s !== "string") return "";
    var t = s.toLowerCase().replace(/[^a-z0-9]/g, "");
    return t.length < 6 ? "" : t.slice(-8);
  }
  function tagOf(rec) {
    if (rec.kind !== "command") return span(rec.plan_slug || "", "tag");
    var tail = rec.attended === true ? sessionTail(rec.orchestrator_session) : "";
    return span(tail ? rec.command + " \u00b7 " + tail : rec.command, "tag");
  }

  function chip(phase) {
    var c = el("span", "chip " + phase.state, (STATE_GLYPH[phase.state] || "?") + " " + phase.state + " · " + phase.id);
    var d = drift(phase);
    if (d) {
      var mark = el("span", "drift " + d.level, "· " + d.text);
      mark.title = d.title;
      c.appendChild(mark);
    }
    return c;
  }
  function chips(rec) {
    var wrap = el("div", "chips");
    wrap.setAttribute("aria-label", itemWord(rec));
    rec.phases.forEach(function (p) { wrap.appendChild(chip(p)); });
    return wrap;
  }

  // Dependency depth of each phase (0 for no dependencies); cycles and unknown ids count as 0.
  function depths(phases) {
    var byId = {}, memo = {};
    phases.forEach(function (p) { byId[p.id] = p; });
    function depth(id, seen) {
      if (memo[id] !== undefined) return memo[id];
      var p = byId[id];
      if (!p || seen[id]) return 0;
      seen[id] = true;
      var d = 0;
      (p.depends_on || []).forEach(function (dep) { if (byId[dep]) d = Math.max(d, depth(dep, seen) + 1); });
      memo[id] = d;
      return d;
    }
    phases.forEach(function (p) { depth(p.id, {}); });
    return memo;
  }

  function detail(rec, now) {
    var box = el("div", "detail");
    var links = el("div", "links");
    add(links, link(rec.plan_url, "plan"), sessionLink(rec),
      rec.pr && rec.pr.url ? link(rec.pr.url, "PR #" + rec.pr.number) : null);
    if (links.childNodes.length) box.appendChild(links);
    box.appendChild(el("div", "meta", itemWord(rec) + " · " + (rec.last_event || "")));
    var depth = depths(rec.phases), stages = [];
    rec.phases.forEach(function (p) { (stages[depth[p.id]] = stages[depth[p.id]] || []).push(p); });
    stages.forEach(function (list, i) {
      if (!list) return;
      var stage = el("div", "stage");
      stage.appendChild(el("div", "stage-title", "Stage " + (i + 1)));
      list.forEach(function (p) {
        var item = el("div", "item");
        var head = el("div", "head");
        add(head, el("span", "chip " + p.state, (STATE_GLYPH[p.state] || "?") + " " + p.state),
          el("span", "name", p.title));
        item.appendChild(head);
        var bits = [p.id];
        if (p.complexity) bits.push("size " + p.complexity);
        if (p.started_at) bits.push("started " + ago(p.started_at, now));
        if (p.finished_at) bits.push("finished " + ago(p.finished_at, now));
        var dr = drift(p);
        if (dr) bits.push(dr.level === "unknown" ? "scope check unavailable" : dr.title);
        item.appendChild(el("div", "meta", bits.join(" · ")));
        var extra = el("div", "links");
        add(extra, p.branch ? span(p.branch) : null,
          sessionHref(p.session) ? link(sessionHref(p.session), "session") : null,
          p.pr ? link("https://github.com/" + rec.repo + "/pull/" + p.pr, "PR #" + p.pr) : null);
        if (extra.childNodes.length) item.appendChild(extra);
        stage.appendChild(item);
      });
      box.appendChild(stage);
    });
    if (!rec.phases.length) box.appendChild(el("div", "meta", "No " + itemWord(rec).toLowerCase() + " yet."));
    return box;
  }

  // A row is a tappable card: a summary that is always visible and the per-project detail on tap.
  function row(entry, kind, now, summaryBuilder, extraBuilder) {
    var rec = entry.data;
    var box = el("details", "row " + kind);
    box.setAttribute("data-project", rec.project);
    box.setAttribute("data-doc", entry.id);
    var sum = el("summary");
    summaryBuilder(sum, rec);
    box.appendChild(sum);
    var body = detail(rec, now);
    box.appendChild(body);
    if (extraBuilder && csrf) extraBuilder(body, entry);
    return box;
  }

  // The owner's buttons (shown only after the login): a dismissal is kept next to the record, the record is not written.
  function ownerButton(label, action, entry, onClick) {
    var b = el("button", "quiet", label);
    b.type = "button";
    b.setAttribute("data-action", action);
    b.addEventListener("click", function () {
      b.disabled = true;
      onClick().then(function (r) {
        if (r.status === 409) { load().then(function () { fail("The record changed. Look at it again."); }); return; }
        if (r.status !== 200) { b.disabled = false; fail("Not done: HTTP " + r.status); return; }
        load();
      }).catch(function (err) {
        if (err instanceof Unauthorized) { showLogin("Your session ended. Log in again."); return; }
        b.disabled = false;
        fail("Not done: the board cannot be reached.");
      });
    });
    var wrap = el("div", "actions");
    wrap.appendChild(b);
    return wrap;
  }
  // The button carries data-action="dismiss" (in the details of every card outside Hidden, shown after the login).
  function dismissButton(body, entry) {
    body.appendChild(ownerButton("Dismiss", "dismiss", entry, function () {
      return api("POST", "api/records/" + encodeURIComponent(entry.id) + "/dismiss", { version: entry.version });
    }));
  }
  // The button carries data-action="restore" (in the details of a dismissed card in Hidden).
  function restoreButton(body, entry) {
    body.appendChild(ownerButton("Restore", "restore", entry, function () {
      return api("POST", "api/records/" + encodeURIComponent(entry.id) + "/restore");
    }));
  }

  function headLine(rec, extra) {
    var head = el("div", "head");
    add(head, el("span", "name", rec.project), tagOf(rec), extra);
    return head;
  }

  function needsRow(entry, now) {
    return row(entry, "need", now, function (sum, rec) {
      add(sum, headLine(rec, span("⚑ needs you", "badge failed")),
        el("div", "reason", rec.needs_you_reason),
        span(waited(rec.needs_you_since || rec.updated_at, now)));
    }, dismissButton);
  }
  function prRow(entry, now) {
    return row(entry, "pr", now, function (sum, rec) {
      var prs = rec.pr && rec.pr.number ? [{ number: rec.pr.number, url: rec.pr.url, ci: rec.pr.ci, awaiting: rec.pr.awaiting }] :
        rec.phases.filter(function (p) { return p.pr; }).map(function (p) {
          return { number: p.pr, url: "https://github.com/" + rec.repo + "/pull/" + p.pr, ci: null, awaiting: null };
        });
      sum.appendChild(headLine(rec, span("⇄ PR open", "badge")));
      if (!prs.length) sum.appendChild(span("PR number not recorded"));
      prs.forEach(function (pr) {
        var line = el("div", "meta");
        add(line, link(pr.url, "PR #" + pr.number) || el("span", null, "PR #" + pr.number));
        line.appendChild(document.createTextNode(" · CI " + (pr.ci || "unknown") +
          " · awaiting " + (pr.awaiting === "codeowner" ? "codeowner" : pr.awaiting === "ci" ? "CI" : "nobody")));
        sum.appendChild(line);
      });
    }, dismissButton);
  }
  function runRow(entry, now) {
    return row(entry, "run", now, function (sum, rec) {
      var silent = isSilent(rec, now) ? span("⚠ silent", "badge silent") : null;
      add(sum, headLine(rec, silent), span(rec.status.replace("_", " ") + " · updated " + ago(rec.updated_at, now)),
        rec.phases.length ? chips(rec) : null);
      if (silent) sum.appendChild(span("No check-in since " + ago(rec.updated_at, now) + "."));
    }, dismissButton);
  }
  function doneRow(entry, now) {
    return row(entry, "done", now, function (sum, rec) {
      var mark = rec.status === "failed" ? span("✕ failed", "badge failed") : span("✓ done", "badge");
      add(sum, headLine(rec, mark), span("finished " + ago(rec.finished_at, now)));
    }, dismissButton);
  }
  function answeredRow(entry, placed, now) {
    return row(entry, "run", now, function (sum, rec) {
      add(sum, headLine(rec, span("✓ answer received", "badge")),
        span("Waiting for the session to continue · answered " + ago(placed.ask.answered_at, now)));
    }, dismissButton);
  }
  function hiddenRow(entry, placed, now) {
    return row(entry, "hid", now, function (sum, rec) {
      add(sum, headLine(rec, span(placed.badge === "dismissed" ? "dismissed" : rec.status, "badge")),
        span("updated " + ago(rec.updated_at, now)));
    }, placed.badge === "dismissed" ? restoreButton : null);
  }

  function sect(name, title, count) {
    var s = el("section");
    s.setAttribute("data-section", name);
    s.appendChild(el("h2", null, title + (count !== null ? " (" + count + ")" : "")));
    return s;
  }
  function newestFirst(field) {
    return function (a, b) { return Date.parse(b.data[field]) - Date.parse(a.data[field]); };
  }

  // -- asks ---------------------------------------------------------------------------------------

  function askRow(ask, now) {
    var box = el("div", "row ask " + ask.state);
    box.setAttribute("data-ask", ask.id);
    box.setAttribute("role", "link");
    box.tabIndex = 0;
    var head = el("div", "head");
    var badge = ask.state === "open" ? span("? asks you", "badge failed") : span(ask.state, "badge");
    add(head, el("span", "name", ask.project), span(ask.questions.length + (ask.questions.length === 1 ? " question" : " questions"), "tag"), badge);
    box.appendChild(head);
    box.appendChild(el("div", "reason", ask.title));
    box.appendChild(span(ask.state === "open" ? waited(ask.created_at, now) : "answered " + ago(ask.answered_at, now)));
    function open() { location.hash = "ask=" + encodeURIComponent(ask.id); }
    box.addEventListener("click", open);
    box.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); open(); } });
    return box;
  }

  function render(entries, asks) {
    asks = asks || [];
    var openAsks = asks.filter(function (a) { return a.state === "open"; });
    var closedAsks = asks.filter(function (a) { return a.state !== "open"; });
    var now = nowMs();
    var groups = { needs_you: [], pr_open: [], running: [], done: [], hidden: [] };
    var placed = {};
    entries.forEach(function (e) {
      var p;
      // A bad item must not stop the whole board: fall back to the plain rule.
      try { p = place(e, asks, now); } catch (err) { p = { section: section(e.data, now), badge: null, ask: null }; }
      placed[e.id] = p;
      if (p.section !== "linked") groups[p.section].push(e);
    });
    groups.needs_you.sort(function (a, b) {
      return Date.parse(a.data.needs_you_since || a.data.updated_at) - Date.parse(b.data.needs_you_since || b.data.updated_at);
    });
    groups.pr_open.sort(newestFirst("updated_at"));
    groups.running.sort(newestFirst("updated_at"));
    groups.done.sort(newestFirst("finished_at"));

    document.getElementById("title").textContent = document.title;
    var newest = entries.reduce(function (m, e) { return Math.max(m, Date.parse(e.data.updated_at)); }, 0);
    document.getElementById("updated").textContent = newest ? "Newest update " + ago(new Date(newest).toISOString(), now) : "No records yet";
    var counts = document.getElementById("counts");
    counts.textContent = "";
    [["? asks", openAsks], ["⚑ needs you", groups.needs_you], ["▶ running", groups.running], ["⇄ PR open", groups.pr_open], ["✓ done", groups.done]]
      .forEach(function (c) { counts.appendChild(el("span", "count", c[0] + " " + c[1].length)); });

    var main = document.getElementById("main");
    main.textContent = "";

    var need = sect("needs_you", "Needs you", null);
    openAsks.forEach(function (a) { need.appendChild(askRow(a, now)); });
    if (groups.needs_you.length) groups.needs_you.forEach(function (e) { need.appendChild(needsRow(e, now)); });
    else if (!openAsks.length) need.appendChild(el("div", "empty", "Nothing needs you"));
    main.appendChild(need);

    if (groups.pr_open.length) {
      var pr = sect("pr_open", "PR open", groups.pr_open.length);
      groups.pr_open.forEach(function (e) { pr.appendChild(prRow(e, now)); });
      main.appendChild(pr);
    }
    var run = sect("running", "Running", groups.running.length);
    var answered = groups.running.filter(function (e) { return placed[e.id].badge === "answer_received"; });
    var plain = groups.running.filter(function (e) { return placed[e.id].badge !== "answer_received"; });
    if (groups.running.length) {
      answered.forEach(function (e) { run.appendChild(answeredRow(e, placed[e.id], now)); });
      plain.forEach(function (e) { run.appendChild(runRow(e, now)); });
    }
    else run.appendChild(el("div", "empty", "Nothing is running"));
    main.appendChild(run);

    var done = sect("done", "Done", groups.done.length);
    if (groups.done.length) groups.done.forEach(function (e) { done.appendChild(doneRow(e, now)); });
    else done.appendChild(el("div", "empty", "Nothing finished in the last 7 days"));
    var hidden = el("details", "card");
    hidden.setAttribute("data-section", "hidden");
    hidden.appendChild(el("summary", null, "Hidden: " + groups.hidden.length));
    hidden.appendChild(el("div", "meta", "No update for more than 7 days, finished earlier, or dismissed. Still stored."));
    groups.hidden.sort(newestFirst("updated_at")).forEach(function (e) { hidden.appendChild(hiddenRow(e, placed[e.id], now)); });
    done.appendChild(hidden);
    main.appendChild(done);

    if (closedAsks.length) {
      var answered = el("details", "card");
      answered.setAttribute("data-section", "answered");
      answered.appendChild(el("summary", null, "Answered and cancelled asks: " + closedAsks.length));
      closedAsks.forEach(function (a) { answered.appendChild(askRow(a, now)); });
      main.appendChild(answered);
    }
  }

  function fail(text) {
    var note = document.getElementById("status");
    if (!note) { note = el("div", "notice"); note.id = "status"; document.getElementById("main").prepend(note); }
    note.textContent = text;
    note.className = "notice bad";
  }

  function validEntries(list) {
    return list.filter(function (e) { return e && e.data && typeof e.data === "object" && Array.isArray(e.data.phases); });
  }
  function validAsks(list) {
    return list.filter(function (a) { return a && typeof a.id === "string" && Array.isArray(a.questions); });
  }

  function pollMs() {
    var m = /[?&]poll=(\d+)/.exec(location.search);
    var n = m ? parseInt(m[1], 10) : 0;
    return n >= 500 ? n : 15000;
  }

  function openKeys() {
    var keys = [];
    Array.prototype.forEach.call(document.querySelectorAll("details[open]"), function (d) {
      var key = d.getAttribute("data-doc") || d.getAttribute("data-project");
      if (key) keys.push("p:" + key);
      else if (d.getAttribute("data-section")) keys.push("s:" + d.getAttribute("data-section"));
    });
    return keys;
  }

  function restoreOpen(keys) {
    Array.prototype.forEach.call(document.querySelectorAll("details"), function (d) {
      var key = d.getAttribute("data-doc") || d.getAttribute("data-project");
      var id = key ? "p:" + key : (d.getAttribute("data-section") ? "s:" + d.getAttribute("data-section") : null);
      if (id !== null && keys.indexOf(id) !== -1) d.open = true;
    });
  }

  // -- talking to the server ----------------------------------------------------------------------

  var csrf = null;
  var lastText = null;
  var lastRender = 0;
  var lastAsks = [];
  var timer = null;

  function Unauthorized() { this.message = "unauthorized"; }

  function api(method, path, body) {
    var opts = { method: method, cache: "no-store", credentials: "same-origin", headers: {} };
    if (body !== undefined) {
      opts.headers["Content-Type"] = "application/json";
      opts.body = JSON.stringify(body);
    }
    if (method !== "GET" && csrf) opts.headers["X-CSRF-Token"] = csrf;
    return fetch(path, opts).then(function (resp) {
      return resp.text().then(function (text) {
        var data = null;
        try { data = text ? JSON.parse(text) : null; } catch (e) { data = null; }
        if (resp.status === 401 && path !== "login") throw new Unauthorized();
        return { status: resp.status, data: data };
      });
    });
  }

  function show(id, visible) {
    var node = document.getElementById(id);
    node.className = node.className.replace(/\s*hidden-view/g, "") + (visible ? "" : " hidden-view");
  }

  function flash(text) { var n = document.getElementById("flash"); n.textContent = text; show("flash", !!text); }

  function showLogin(message) {
    csrf = null;
    if (timer !== null) { clearInterval(timer); timer = null; }
    show("login", true);
    show("logout", false);
    show("usage-link", false);
    stopUsage();
    flash("");
    show("askview", false);
    show("usageview", false);
    show("main", false);
    document.getElementById("counts").textContent = "";
    document.getElementById("updated").textContent = "";
    document.getElementById("login-status").textContent = message || "";
    document.getElementById("passphrase").focus();
  }

  function load() {
    return Promise.all([api("GET", "api/records"), api("GET", "api/asks")]).then(function (res) {
      if (res[0].status !== 200 || res[1].status !== 200) throw new Error("HTTP " + res[0].status + "/" + res[1].status);
      var records = res[0].data && Array.isArray(res[0].data.records) ? res[0].data.records : [];
      var asks = res[1].data && Array.isArray(res[1].data.asks) ? validAsks(res[1].data.asks) : [];
      lastAsks = asks;
      var text = JSON.stringify([records, asks]);
      var t = Date.now();
      if (text !== lastText || t - lastRender >= 60000 || document.getElementById("status")) {
        var keys = openKeys();
        render(validEntries(records), asks);
        restoreOpen(keys);
        lastText = text;
        lastRender = t;
      }
    }).catch(function (err) {
      if (err instanceof Unauthorized) { showLogin("Your session ended. Log in again."); return; }
      fail("Cannot reach the board server (" + (err && err.message ? err.message : err) + "). What is shown may be out of date.");
    });
  }

  // -- the ask view -------------------------------------------------------------------------------

  function answerText(q, value) {
    if (q.kind === "confirm") return value === true ? "yes" : value === false ? "no" : "";
    if (q.kind === "choice") {
      var opt = (q.options || []).filter(function (o) { return o.value === value; })[0];
      return opt ? (opt.label || opt.value) : String(value);
    }
    return String(value);
  }

  function control(q, n) {
    var wrap = el("div", "controls");
    var name = "q" + n;
    function radio(value, labelText) {
      var row = el("label", "opt");
      var input = el("input");
      input.type = "radio";
      input.name = name;
      input.value = value;
      if (q.required !== false) input.required = true;
      add(row, input, el("span", null, labelText));
      wrap.appendChild(row);
    }
    if (q.kind === "choice") (q.options || []).forEach(function (o) { radio(o.value, o.label || o.value); });
    else if (q.kind === "confirm") { radio("yes", "Yes"); radio("no", "No"); }
    else {
      var area = el("textarea");
      area.name = name;
      area.maxLength = 4000;
      if (q.required !== false) area.required = true;
      area.setAttribute("aria-label", q.id);
      wrap.appendChild(area);
    }
    return wrap;
  }

  function readAnswers(form, ask) {
    var answers = {};
    ask.questions.forEach(function (q, n) {
      var name = "q" + n;
      if (q.kind === "text") {
        var v = form.elements[name].value;
        if (v.trim()) answers[q.id] = v;
        return;
      }
      var picked = form.querySelector('input[name="' + name + '"]:checked');
      if (!picked) return;
      answers[q.id] = q.kind === "confirm" ? picked.value === "yes" : picked.value;
    });
    return answers;
  }

  function renderAsk(ask) {
    var view = document.getElementById("askview");
    view.textContent = "";
    var card = el("div", "card");
    card.setAttribute("data-ask-view", ask.id);
    var back = el("a", "back", "← Inbox");
    back.href = "#";
    view.appendChild(back);
    card.appendChild(el("h2", "ask-title", ask.title));
    var meta = [ask.project, "asked " + ago(ask.created_at, nowMs()), "by " + ask.created_by];
    card.appendChild(el("div", "meta", meta.join(" · ")));
    var links = el("div", "links");
    add(links, link(ask.context_url, "context"), sessionHref(ask.created_by) ? link(sessionHref(ask.created_by), "session") : null);
    if (links.childNodes.length) card.appendChild(links);
    var status = el("div", "notice");
    status.id = "ask-status";
    if (ask.state !== "open") {
      card.appendChild(el("div", "meta", ask.state === "answered" ? "Answered " + ago(ask.answered_at, nowMs()) + "." : "Cancelled."));
      ask.questions.forEach(function (q) {
        var block = el("div", "q");
        add(block, el("div", "q-id", q.id), el("div", "q-text", q.text));
        var has = Object.prototype.hasOwnProperty.call(ask.answers || {}, q.id);
        block.appendChild(el("div", "answer", has ? answerText(q, ask.answers[q.id]) : "(no answer)"));
        card.appendChild(block);
      });
      view.appendChild(card);
      return;
    }
    var form = el("form");
    form.id = "ask-form";
    ask.questions.forEach(function (q, n) {
      var block = el("fieldset", "q card");
      block.setAttribute("data-question", q.id);
      var legend = el("legend", "q-id", q.id + (q.required === false ? " (optional)" : ""));
      add(block, legend, el("div", "q-text", q.text), control(q, n));
      form.appendChild(block);
    });
    var actions = el("div", "actions");
    var submit = el("button", null, "Send answers");
    submit.type = "submit";
    submit.id = "ask-submit";
    var cancel = el("button", "quiet", "Cancel this ask");
    cancel.type = "button";
    cancel.id = "ask-cancel";
    add(actions, submit, cancel);
    form.appendChild(actions);
    form.appendChild(status);
    form.addEventListener("submit", function (ev) {
      ev.preventDefault();
      submit.disabled = true;
      status.className = "notice";
      status.textContent = "Sending…";
      api("POST", "api/asks/" + encodeURIComponent(ask.id) + "/answer", { answers: readAnswers(form, ask) }).then(function (r) {
        submit.disabled = false;
        if (r.status === 200 && r.data) { flash("Answers sent: " + ask.title); location.hash = ""; load(); return; }
        status.className = "notice bad";
        var errs = r.data && Array.isArray(r.data.errors) ? r.data.errors.join("; ") : (r.data && r.data.error) || ("HTTP " + r.status);
        status.textContent = "Not sent: " + errs;
      }).catch(function (err) {
        submit.disabled = false;
        if (err instanceof Unauthorized) { showLogin("Your session ended. Log in again."); return; }
        status.className = "notice bad";
        status.textContent = "Not sent: the board cannot be reached.";
      });
    });
    cancel.addEventListener("click", function () {
      cancel.disabled = true;
      api("POST", "api/asks/" + encodeURIComponent(ask.id) + "/cancel").then(function (r) {
        if (r.status === 200 && r.data) { flash("Ask cancelled: " + ask.title); location.hash = ""; load(); }
        else { cancel.disabled = false; status.className = "notice bad"; status.textContent = "Not cancelled: HTTP " + r.status; }
      }).catch(function (err) { cancel.disabled = false; if (err instanceof Unauthorized) showLogin("Your session ended. Log in again."); });
    });
    card.appendChild(form);
    view.appendChild(card);
  }

  var usageTimer = null;
  var usageSeq = 0;
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  var USAGE_KINDS = [["five_hour", "5-hour window"], ["seven_day", "Weekly window"]];
  var USAGE_DAYS = { five_hour: 30, seven_day: 56 };

  function stopUsage() {
    usageSeq++;
    if (usageTimer !== null) { clearInterval(usageTimer); usageTimer = null; }
  }

  function pad2(n) { return (n < 10 ? "0" : "") + n; }
  function whole(n) { return String(Math.round(n)); }

  function usageBarRow(label, pct, isStandard) {
    var bar = usageBar(pct);
    var row = el("div", "usage-row");
    var track = el("div", "track");
    track.setAttribute("role", "img");
    track.setAttribute("aria-label", label + ": " + whole(pct) + " percent of the limit");
    var fill = el("div", isStandard && bar.over ? "fill over" : "fill");
    fill.style.width = bar.fill + "%";
    add(track, fill);
    add(row, el("span", "lbl", label), track,
      el("span", "pct", whole(pct) + "%" + (isStandard && bar.over ? " (limit passed)" : "")));
    return row;
  }

  function usageCard(title, win, factor, now) {
    var card = el("div", "card usage-card");
    add(card, el("h3", null, title));
    if (!win) { add(card, el("div", "notice", "No window is running.")); return card; }
    add(card, usageBarRow("Standard", win.last_standard, true), usageBarRow("Max", win.last_standard / factor, false));
    var left = win.resets_at - now;
    var since = now - win.last_seen;
    add(card, el("div", "notice", (left < 60 ? "resets in under a minute" : "resets in " + usageAgo(left)) +
      " · last reading " + usageAgo(since) + (since < 60 ? "" : " ago")));
    return card;
  }

  function usageChart(kind, windows, factor, now) {
    var from = now - USAGE_DAYS[kind] * 86400;
    var done = windows.filter(function (w) { return w.complete === true && w.resets_at >= from; });
    var wrap = el("div", "usage-history");
    if (done.length === 0) { add(wrap, el("div", "notice", "No finished windows yet.")); return wrap; }
    var top = 120;
    done.forEach(function (w) { top = Math.max(top, 1.1 * w.peak_standard); });
    var chart = el("div", "chart");
    done.forEach(function (w) {
      var cls = "col" + (w.over ? " over" : "") + (w.idle ? " idle" : "");
      var col = el("div", cls);
      col.style.height = (Math.min(w.peak_standard, top) / top * 100) + "%";
      var d = new Date(w.start * 1000);
      col.title = d.getDate() + " " + MONTHS[d.getMonth()] + " " + pad2(d.getHours()) + ":" + pad2(d.getMinutes()) +
        " - peak " + whole(w.peak_standard) + "% of Standard (" + whole(w.peak_standard / factor) + "% of Max), " +
        w.samples + " readings";
      chart.appendChild(col);
    });
    var lines = [[100, "Standard limit"]];
    if (factor * 100 < top) lines.push([factor * 100, "Max limit"]);
    lines.forEach(function (l) {
      var line = el("div", "limit-line");
      line.style.bottom = (l[0] / top * 100) + "%";
      add(line, el("span", null, l[1]));
      chart.appendChild(line);
    });
    add(wrap, chart);
    return wrap;
  }

  function renderUsage(data) {
    var view = document.getElementById("usageview");
    view.textContent = "";
    var back = el("a", "back", "← Back to the board");
    back.href = "#";
    add(view, back, el("h2", "ask-title", "Subscription usage"));
    if (!data || typeof data.now !== "number" || !data.windows) {
      add(view, el("div", "notice bad", "The usage data could not be read."));
      return;
    }
    if (data.plan === null || data.plan === undefined) {
      add(view, el("div", "notice", "Usage is off. Set TLD_BOARD_PLAN=max (or standard) on the board host and restart it."));
      return;
    }
    var factor = data.factor > 0 ? data.factor : 5;
    var now = data.now;
    add(view, el("div", "notice", data.plan === "max" ?
      "You are on Max (" + factor + "x). Max = " + factor + "x Standard (assumed)." :
      "You are on Standard. Use above 100% is invisible here, so this page cannot show whether Max is worth it."));
    var any = USAGE_KINDS.some(function (k) { return (data.windows[k[0]] || []).length > 0; });
    if (!any) { add(view, el("div", "notice", "No readings yet. They arrive when a tld command ends or the /tld:usage task runs.")); return; }
    USAGE_KINDS.forEach(function (k) {
      var list = data.windows[k[0]] || [];
      add(view, usageCard(k[1], usageNow(list, now), factor, now));
      var section = el("div", "card usage-card");
      add(section, el("h3", null, k[1] + ": history"), usageChart(k[0], list, factor, now));
      var verdict = usageVerdict(list, k[0], now);
      var vnode = el("div", "verdict " + verdict.kind, verdict.text);
      add(section, vnode);
      add(view, section);
    });
  }

  function loadUsage() {
    var seq = ++usageSeq;
    api("GET", "api/usage").then(function (r) {
      if (seq !== usageSeq) return;
      if (r.status === 200 && r.data) renderUsage(r.data);
      else {
        var view = document.getElementById("usageview");
        view.textContent = "";
        add(view, el("div", "notice bad", "Usage could not be loaded: HTTP " + r.status));
      }
    }).catch(function (err) {
      if (err instanceof Unauthorized) showLogin("Your session ended. Log in again.");
    });
  }

  function route() {
    stopUsage();
    if (location.hash === "#usage") {
      flash("");
      show("main", false);
      show("askview", false);
      show("usageview", true);
      var uv = document.getElementById("usageview");
      uv.textContent = "";
      uv.appendChild(el("div", "notice", "Loading…"));
      loadUsage();
      usageTimer = setInterval(loadUsage, 60000);
      return;
    }
    show("usageview", false);
    var m = /^#ask=([A-Za-z0-9-]+)$/.exec(location.hash);
    if (!m) {
      document.getElementById("askview").textContent = "";
      show("askview", false);
      show("main", true);
      return;
    }
    flash("");
    show("main", false);
    show("askview", true);
    var view = document.getElementById("askview");
    view.textContent = "";
    view.appendChild(el("div", "notice", "Loading…"));
    api("GET", "api/asks/" + encodeURIComponent(m[1])).then(function (r) {
      if (r.status === 200 && r.data) renderAsk(r.data);
      else { view.textContent = ""; view.appendChild(el("div", "notice bad", "No such ask.")); }
    }).catch(function (err) {
      if (err instanceof Unauthorized) showLogin("Your session ended. Log in again.");
    });
  }

  function startInbox() {
    show("login", false);
    show("logout", true);
    show("usage-link", true);
    route();
    load();
    if (timer === null) timer = setInterval(load, pollMs());
  }

  function start() {
    document.getElementById("title").textContent = document.title;
    if (FIXTURE !== null) {
      show("main", true);
      render(validEntries(FIXTURE), []);
      return;
    }
    window.addEventListener("hashchange", function () { if (csrf) route(); });
    document.getElementById("login-form").addEventListener("submit", function (ev) {
      ev.preventDefault();
      var input = document.getElementById("passphrase");
      var button = document.getElementById("login-button");
      button.disabled = true;
      api("POST", "login", { passphrase: input.value }).then(function (r) {
        button.disabled = false;
        input.value = "";
        if (r.status === 200 && r.data && r.data.csrf) { csrf = r.data.csrf; startInbox(); return; }
        var msg = r.status === 429 ? "Too many attempts. Wait " + ((r.data && r.data.retry_after) || "a few") + " seconds." :
          r.status === 401 ? "Wrong passphrase." : "Login failed (HTTP " + r.status + ").";
        document.getElementById("login-status").textContent = msg;
      }).catch(function () {
        button.disabled = false;
        document.getElementById("login-status").textContent = "The board cannot be reached.";
      });
    });
    document.getElementById("logout").addEventListener("click", function () {
      api("POST", "logout").then(function () { showLogin("Logged out."); }, function () { showLogin(""); });
    });
    api("GET", "api/session").then(function (r) {
      if (r.status === 200 && r.data && r.data.owner && r.data.csrf) { csrf = r.data.csrf; startInbox(); }
      else showLogin("");
    }).catch(function () { fail("Cannot reach the board server."); });
  }
  start();
})();
</script>
</body>
</html>
