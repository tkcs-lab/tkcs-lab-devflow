# Starter policy for scripts/repo_admin.py (the repo-admin skill). Copy it next to your profile, for
# example to .claude/admin-policy.yaml, set `admin.policy` in .claude/toolkit.yaml, and edit.
# A section you leave out is not managed. Everything irreversible is off here; turn it on once an
# audit shows only what you expect. Reference: docs/guides/admin.md in https://github.com/tkcs-lab/claude-toolkit

org: your-org                      # REQUIRED: the GitHub organisation

repos:
  include: ["*"]                   # name globs; default all
  exclude: []                      # e.g. ["sandbox-*"]
  skip_archived: true
  skip_forks: true

org_settings:                      # changed with PATCH /orgs/{org}
  default_repository_permission: read
  members_can_create_public_repositories: false
  web_commit_signoff_required: false
  two_factor_requirement_enabled: true   # read only: a difference is reported, you change it by hand

members:
  require_two_factor: true         # report members without two-factor authentication
  max_owners: 3

apps:                              # report installed apps that are not listed (GitHub has no 'last used' for apps)
  allow: []                        # app slugs, e.g. ["dependabot", "codecov"]

tokens:
  fine_grained:                    # fine-grained personal access tokens with access to the organisation
    max_unused_days: 90            # revoke a token unused for this long (needs --allow-delete)
    revoke_expired: true

repo_settings:                     # changed with PATCH /repos/{owner}/{repo}
  allow_auto_merge: true
  delete_branch_on_merge: true
  allow_update_branch: true
  has_wiki: false
  has_projects: false

security:
  vulnerability_alerts: true
  automated_security_fixes: true
  secret_scanning: true
  secret_push_protection: true
  private_vulnerability_reporting: true

actions:
  default_workflow_permissions: read
  can_approve_pull_request_reviews: false

branch_protection:                 # added where the branch has no rule and no ruleset; an existing rule is only reported
  branch: default
  require_pull_request: true
  approvals: 1
  require_status_checks: []        # e.g. ["test"]
  enforce_admins: false
  allow_force_pushes: false
  allow_deletions: false

secrets:
  required: []                     # e.g. ["DEVFLOW_AGENT_TOKEN"]: a repository without it, own or from the organisation, is reported
  keep: []                         # never reported as unused
  delete_unused: false             # true: delete a secret no workflow refers to (needs --allow-delete)

variables:
  required: []
  keep: []
  delete_unused: false

labels:
  sync:                            # every repository gets exactly these (colour is 6 hex digits)
    - { name: bug, color: d73a4a, description: "Something is broken" }
    - { name: enhancement, color: a2eeef, description: "New feature or improvement", aliases: [feature] }
    - { name: documentation, color: 0075ca, description: "Documentation only" }
    - { name: dependencies, color: 0366d6, description: "Dependency updates" }
  keep: []                         # labels outside sync that stay
  delete_unused: false             # true: delete labels outside sync that are on no issue or pull request
  delete_unlisted: false           # true: delete every label outside sync and keep, even one in use

webhooks:
  delete: []                       # [inactive, failing]: delete such hooks (needs --allow-delete); empty: report only
  keep_urls: []

deploy_keys:
  max_unused_days: 180
  delete_unused: false

branches:                          # branches already merged into the default branch (squash-merged ones are not detected)
  delete_merged: false             # true: delete them (needs --allow-delete)
  min_age_days: 14
  keep: ["release/*", "gh-pages"]

config_dirs:
  forbid: []                       # paths removed through a pull request, e.g. [".archon"]
  require: []                      # files every repository needs, e.g. [SECURITY.md, .github/CODEOWNERS, LICENSE]
  # known: [.cursor]               # more top-level dot directories to expect (.github, .claude and a few more are built in); any other is reported

workflow_lint:                     # read only: what to fix by hand in the workflow files
  pin_actions: third_party         # third_party | all: actions not pinned to a commit SHA
  require_permissions: true
  forbid_pull_request_target: true

workflows:                         # installed or updated through a pull request; the script never merges it
  - template: release              # cut a release: annotated tag plus GitHub release (run by hand; starts as a dry run)
    params: { tag_prefix: "v" }
  # - template: land               # the /land workflow, if you use /land
  # - path: workflows/ci.yml       # your own template (relative to this file); __UPPER_CASE__ placeholders come from params
  #   dest: .github/workflows/ci.yml
  #   repos: ["service-*"]
