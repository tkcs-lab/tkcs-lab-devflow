# Profile of the tkcs-lab-devflow repository itself (read by /make-plan, /implement, /dod, /review).
# Reference: docs/reference/profile-reference.md

project:
  name: tkcs-lab-devflow

docs:
  must_read:
    - README.md
  plan_dir: docs/

git:
  main_branch: main
  branch_pattern: "<type>/<kebab-case>"
  branch_types: [feature, fix, chore]
  merge_style: merge-commit

verify:
  fast:
    - "python3 -m venv --upgrade-deps .venv && .venv/bin/python -m pip install -q -r tests/requirements.txt && .venv/bin/python -m pytest tests -q"
  dod:
    - "python3 -m venv --upgrade-deps .venv && .venv/bin/python -m pip install -q -r tests/requirements.txt && .venv/bin/python -m pytest tests -q"
    - ".venv/bin/python bin/tld profile validate src/tld/templates/toolkit.yaml --no-file-checks"
    - ".venv/bin/python bin/tld profile validate .tld/toolkit.yaml"
    - ".venv/bin/python bin/tld ops repo-admin validate-policy src/tld/templates/admin-policy.yaml"
    - 'for m in tests/fixtures/privacyfence-*-manifest.yaml; do .venv/bin/python bin/tld plan validate-manifest "$m" --profile tests/fixtures/privacyfence-toolkit.yaml || exit 1; done'
  dod_manual:
    - "Every behaviour a command file promises is covered by a test that greps the exact string or runs the script."
    - "No project-specific word was added to src/, adapters/ or .claude-plugin/ (tests/core/test_no_project_words.py)."

stacks: [python]
