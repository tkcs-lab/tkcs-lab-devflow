# Profile of the tkcs-lab-devflow repository itself (read by the playbooks make-plan, implement, dod, review).
# Reference: docs/reference/profile-reference.md

tld:
  version: ">=1.0,<2"

project:
  name: tkcs-lab-devflow

docs:
  must_read:
    - README.md
  index: docs/README.md
  plan_dir: docs/plans/

git:
  main_branch: main
  branch_pattern: "<type>/<kebab-case>"
  branch_types: [feature, fix, chore]
  merge_style: merge-commit
  owner_login: andras-tkcs
  bot_login: andras-tkcs-agent
  codeowners: [andras-tkcs]

verify:
  fast:
    - "python3 -m venv --upgrade-deps .venv && .venv/bin/python -m pip install -q -r tests/requirements.txt && .venv/bin/python -m pytest tests -q"
  dod:
    - "python3 -m venv --upgrade-deps .venv && .venv/bin/python -m pip install -q -r tests/requirements.txt && .venv/bin/python -m pytest tests -q"
    - ".venv/bin/python launcher/tld profile validate src/tld/templates/toolkit.yaml --no-file-checks"
    - ".venv/bin/python launcher/tld profile validate .tld/toolkit.yaml"
    - ".venv/bin/python launcher/tld ops repo-admin validate-policy src/tld/templates/admin-policy.yaml"
    - ".venv/bin/python launcher/tld ops repo-admin validate-policy .tld/admin-policy.yaml"
    - 'for m in tests/fixtures/privacyfence-*-manifest.yaml; do .venv/bin/python launcher/tld plan validate-manifest "$m" --profile tests/fixtures/privacyfence-toolkit.yaml || exit 1; done'
  dod_manual:
    - "Every tld command a playbook or adapter names parses with the real CLI, and every behaviour it promises of a script is covered by a test that runs the script (tests/core/test_contracts.py)."
    - "No project-specific word was added to src/, launcher/, adapters/, .claude-plugin/, playbooks/, roles/, checklists/ or stacks/ (tests/core/test_no_project_words.py)."

stacks: [python]

admin:
  policy: .tld/admin-policy.yaml

hooks:
  dod_gate:
    enabled: true
    max_attempts: 3
  plan_gate:
    enabled: true

ci:
  time_budget_minutes: 60
  lookback_hours: 36

deps:
  cooldown_days: 3
  time_budget_minutes: 90
  audit:
    - ecosystem: pip
      run: ".venv/bin/python -m pip install -q pip-audit && .venv/bin/python -m pip_audit -r tests/requirements.txt"

land:
  max_prs: 10

roles:
  posture:
    security: critical
  required:
    - {role: security-reviewer, at: [implement_phase, implement_final], blocking: true}
    - {role: code-reviewer, at: [implement_final], blocking: true}
    - {role: test-architect, at: [make_plan]}
    - {role: tech-writer, at: [dod, review]}
    - {role: dependency-auditor, at: [dod], when: ["pyproject.toml", "tests/requirements.txt"]}
