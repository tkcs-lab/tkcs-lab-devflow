# repo-admin policy of the tkcs-lab-devflow repository itself (docs/guides/admin.md).
# Only the sections below are managed; every other section of the starter is left out on purpose.
# Run with an owner token: launcher/tld ops repo-admin audit --policy .tld/admin-policy.yaml

org: tkcs-lab
repos:
  include: ["tkcs-lab-devflow"]
  skip_archived: true
  skip_forks: true
repo_settings:
  delete_branch_on_merge: true
  allow_update_branch: true
security:
  vulnerability_alerts: true
  automated_security_fixes: true
  secret_scanning: true
  secret_push_protection: true
  private_vulnerability_reporting: true
actions:
  default_workflow_permissions: read
  can_approve_pull_request_reviews: false
rulesets:
  default_branch:
    required_status_checks: ["test (3.11)", "test (3.13)"]
    admin_bypass: false
  tags: true
agent:
  agent_login: andras-tkcs-agent
  branch_policy: default_branch
release:
  reviewer_login: andras-tkcs
  environment: tld-release
workflows:
  - template: land
