# Fixture: a valid profile with the roles block of the plan's worked example.
docs:
  must_read: []
  website:
    dir: site
    build: "npm run build"
    links: "npm run check-links"

git:
  main_branch: main
  branch_pattern: "<type>/<kebab-case>"

verify:
  fast:
    - make lint
  dod:
    - make test

stacks: []

roles:
  posture:
    security: critical
  disable: [dependency-auditor]
  required:
    - {role: security-reviewer, at: [implement_phase, implement_final], blocking: true}
    - {role: ux-reviewer, at: [implement_final], when: ["app/views/**"], blocking: false}
    - {role: test-architect, at: [make_plan]}
    - {role: tech-writer, at: [dod, review]}
    - {role: website-maintainer, at: [dod], when: ["site/**", "docs/**"]}
  extra_context:
    - "Every outbound request is logged."
