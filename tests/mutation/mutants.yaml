# Hand-written mutants for tests/mutation/run_mutants.py (see CONTRIBUTING.md, "Mutation check").
# Each one replaces `old` (it must occur exactly once in `file`) by `new` and runs the tests listed for that file
# under `tests`; a mutant the tests do not fail on SURVIVES and fails the check. They are the mutants of the review (docs/reviews/claude-toolkit-review.md,
# "Tests") and the survivors pinned by tests/core/test_guard_mutations.py, ported to src/tld, plus a few more.
# tests/core/test_mutants_file.py keeps this list in step with the code.
tests:
  src/tld/guard/no_merge.py:
  - tests/core/test_hook_no_merge.py
  - tests/core/test_guard_mutations.py
  - tests/core/test_guard_corpus.py
  src/tld/guard/no_force_push.py:
  - tests/core/test_hook_no_force_push.py
  - tests/core/test_guard_mutations.py
  - tests/core/test_guard_corpus.py
  src/tld/guard/secret_scan.py:
  - tests/core/test_hook_secret_scan.py
  - tests/core/test_guard_mutations.py
  src/tld/guard/protect_paths.py:
  - tests/core/test_hook_protect_paths.py
  - tests/core/test_hook_protect_paths_setup.py
  - tests/core/test_guard_mutations.py
  - tests/core/test_guard_corpus.py
  src/tld/profile/validate.py:
  - tests/core/test_validate_profile.py
  - tests/core/test_profile_roles.py
  - tests/core/test_profile_version.py
  src/tld/plan/manifest.py:
  - tests/core/test_validate_manifest.py
  src/tld/plan/summary.py:
  - tests/core/test_plan_summary.py
  src/tld/guard/markers.py:
  - tests/core/test_guard_markers.py
  - tests/core/test_guard_mutations.py
  - tests/core/test_hook_protect_paths_setup.py
  src/tld/guard/_common.py:
  - tests/core/test_guard_trust.py
  - tests/adapters/claude/test_hooks_config.py
  - tests/core/test_guard_corpus.py
  - tests/core/test_hook_no_force_push.py
  - tests/core/test_hook_no_merge.py
  src/tld/guard/no_git_tag.py:
  - tests/core/test_hook_no_git_tag.py
  - tests/core/test_guard_markers.py
  - tests/core/test_guard_corpus.py
  src/tld/guard/_wrappers.py:
  - tests/core/test_guard_mutations.py
  - tests/core/test_guard_corpus.py
  src/tld/guard/integrity.py:
  - tests/core/test_guard_corpus.py
  - tests/core/test_guard_trust.py
