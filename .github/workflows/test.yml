name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r tests/requirements.txt
      - name: Tests (includes the no-project-specific-strings check)
        run: python -m pytest tests -q
      - name: Validate the marketplace and the plugin
        run: |
          npm install -g @anthropic-ai/claude-code@2.1.322
          claude plugin validate .
      - name: Validators on the starter profile, this repository's profile and the PrivacyFence profile
        run: |
          python bin/tld profile validate src/tld/templates/toolkit.yaml --no-file-checks
          python bin/tld profile validate .tld/toolkit.yaml
          python bin/tld profile validate tests/fixtures/privacyfence-toolkit.yaml --no-file-checks
          python bin/tld ops repo-admin validate-policy src/tld/templates/admin-policy.yaml
          for m in tests/fixtures/privacyfence-*-manifest.yaml; do
            python bin/tld plan validate-manifest "$m" --profile tests/fixtures/privacyfence-toolkit.yaml
          done
      - name: Docs index
        run: python bin/tld ops docs-index check --index docs/README.md
