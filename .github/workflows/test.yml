name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    env:
      # a test whose tool (node, Playwright with Chromium, jq) is missing fails here instead of being skipped
      TLD_REQUIRE_BROWSER: "1"
      PLAYWRIGHT_VERSION: "1.63.0"
      CLAUDE_CODE_VERSION: "2.1.322"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the test requirements
        run: python -m pip install -r tests/requirements.txt
      - name: Install Playwright and Chromium for the board page tests (node is preinstalled on the runner)
        # outside the checkout, so no node_modules/ lands in the repository the tests and checks walk
        run: |
          node --version
          jq --version
          npm install --prefix "$RUNNER_TEMP/pw" --no-save --no-package-lock "playwright@${PLAYWRIGHT_VERSION}"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"
      - name: Check that node finds Playwright
        run: node -e "require('playwright')"
      - name: Tests with the branch coverage gate (src/tld, subprocesses included; floor in pyproject.toml)
        run: python -m pytest tests -q --cov --cov-report=term
      - name: Validate the marketplace and the plugin
        run: |
          npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          claude plugin validate .
      - name: Validators on the starter profile, this repository's profile and the fixtures
        run: |
          python bin/tld profile validate src/tld/templates/toolkit.yaml --no-file-checks
          python bin/tld profile validate .tld/toolkit.yaml
          for p in tests/fixtures/*-toolkit.yaml; do
            python bin/tld profile validate "$p" --no-file-checks
          done
          python bin/tld ops repo-admin validate-policy src/tld/templates/admin-policy.yaml
          for m in tests/fixtures/privacyfence-*-manifest.yaml; do
            python bin/tld plan validate-manifest "$m" --profile tests/fixtures/privacyfence-toolkit.yaml
          done
          for r in tests/fixtures/status-records/good-*.json; do
            python bin/tld board validate-record "$r"
          done
      - name: Docs index
        run: python bin/tld ops docs-index check --index docs/README.md
      - name: Evals in stub mode (every task, canned outcomes, no model call)
        run: |
          python evals/run.py validate
          python evals/run.py check-baseline
          python evals/run.py run --dry-run
          python evals/run.py run --agent stub --repeats 1 --run-ceiling 1 --require-pass --out "$RUNNER_TEMP/evals-stub.jsonl"
