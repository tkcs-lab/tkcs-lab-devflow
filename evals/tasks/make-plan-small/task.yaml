id: make-plan-small
description: A small request must yield a single-session prompt, with all its sections and no plan manifest.
command: /devflow:make-plan
arguments: >-
  Add a --limit N option to the `list` command of the notes CLI so it prints at most N notes.
  This is a small change that one session can do. Decide every open question yourself; nobody can answer.
fixture:
  builder: tiny_app
model: sonnet
repeats: 3
timeout_s: 900
cost_ceiling_usd: 1.5
graders:
  - name: sections_present
    source: result
    sections: [Goal, Context, Design, Steps, Acceptance, Stop conditions, Finish]
  - no_manifest
