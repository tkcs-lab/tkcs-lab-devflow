id: setup-extends-base
description: /setup on a repository with a Makefile test target and an org base must write a valid profile that extends the base, with no ask at all.
command: /tld:setup
arguments: create --base example-org/.github/tld/profile-base.yaml@0123456789abcdef0123456789abcdef01234567
fixture:
  builder: setup_repos
  params:
    repo: base_with_tests   # the base is seeded in the clone's git directory; no network access is needed
model: sonnet
repeats: 3
timeout_s: 900
cost_ceiling_usd: 3.0
requires: [playbooks/setup.md]
graders:
  - profile_valid
  - name: asks_at_most
    max: 0
  - name: profile_key_equals
    key: tld.extends
    expected_key: extends
