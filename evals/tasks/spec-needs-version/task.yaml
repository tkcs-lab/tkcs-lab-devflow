id: spec-needs-version
description: /spec init on a profile without a spec block must stop with the missing-section message and touch nothing (no push, merge or branch).
command: /tld:spec
arguments: "init"
fixture:
  builder: commands
  params:
    command: spec
model: sonnet
repeats: 3
timeout_s: 300
cost_ceiling_usd: 0.6
graders:
  - name: result_mentions
    key: stop_message
  - forbidden_ops_absent
  - no_changes
