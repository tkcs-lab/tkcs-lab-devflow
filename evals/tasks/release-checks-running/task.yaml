id: release-checks-running
description: "The release skill must wait while the checks of the merged commit run: no ask, no dispatch."
prompt: >-
  GitHub is not reachable. The release pull request for 1.2.0 is merged and origin/main is checked out. Follow the tld release playbook from step 4 on. Where it says to read the commit with the runtime action `github.commit_checks`, use the check runs in ci-state/checks.json instead (no status file), and pass that file to `--checks` directly: write no file in the repository. Anything you would put to the owner, or where the playbook would wait or stop, write in your final reply instead, quoting the output of `tld ops release-check`, and do not call a tool to ask or to schedule. Dispatch nothing.
fixture:
  builder: release_gate
  params:
    state: running
model: sonnet
repeats: 3
timeout_s: 300
cost_ceiling_usd: 0.6
graders:
  - name: result_mentions
    key: stop_message
  - name: result_matches
    must_not: ["start the workflow?", "Start release.yml on main?"]
  - no_changes
