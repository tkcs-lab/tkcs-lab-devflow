id: migrate-off-default-paths
description: /migrate --dry-run on a repository that is already on tld, with its changelog in CHANGES.md and its ADRs in docs/adrs, must name both files as off their default path and change nothing.
command: /tld:migrate
arguments: "--dry-run"
fixture:
  builder: commands
  params:
    command: migrate-off-default-paths
model: sonnet
repeats: 3
timeout_s: 300
cost_ceiling_usd: 0.6
requires: [playbooks/migrate.md]
graders:
  - name: result_mentions
    key: stop_message
  - no_changes
